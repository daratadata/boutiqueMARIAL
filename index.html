<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boutique du Sanctuaire marial d’Abidjan</title>
<meta name="theme-color" content="#0F2E73">
<meta name="description" content="Boutique en ligne du Sanctuaire marial national de Côte d’Ivoire, à Abidjan : articles de piété, livraison et paiement par Wave.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sanctuaire">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F5FB;--sf:#fff;--ink:#14213D;--mut:#5A6783;--ln:#DCE5F3;--pri:#1B4DB1;--deep:#0F2E73;--onpri:#fff;--tint:#E6EEFC;--gold:#F2B01E;--ongold:#2A1E00;--ok:#1F7A4D;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1222;--sf:#141E36;--ink:#E8EEF9;--mut:#9AA9C6;--ln:#26355B;--pri:#4F82E8;--deep:#0A1D4A;--onpri:#08142E;--tint:#1B2A4E;--ok:#5FCB92;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1222;--sf:#141E36;--ink:#E8EEF9;--mut:#9AA9C6;--ln:#26355B;--pri:#4F82E8;--deep:#0A1D4A;--onpri:#08142E;--tint:#1B2A4E;--ok:#5FCB92;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 'Nunito Sans',system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--deep);z-index:30}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--deep);color:#fff;padding:10px 0}
.hd{display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font:700 21px/1 'Cormorant Garamond',Georgia,serif;white-space:nowrap}
.search{flex:1;display:flex;align-items:center;gap:8px;background:#fff;color:#14213D;border-radius:10px;padding:0 12px;min-width:0}
.search input{border:0;outline:0;background:none;font:400 15px 'Nunito Sans',sans-serif;color:inherit;padding:11px 0;width:100%;min-width:0}
.ib{position:relative;background:none;border:0;color:#fff;padding:8px;cursor:pointer;border-radius:10px}
.bd{position:absolute;top:0;right:0;background:var(--gold);color:var(--ongold);font:800 11px 'Nunito Sans';border-radius:99px;min-width:18px;height:18px;display:grid;place-items:center}
.cats{display:flex;gap:10px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.cat{flex:none;width:78px;text-align:center;background:none;border:0;color:var(--ink);font:600 12px 'Nunito Sans';cursor:pointer}
.cat span{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 6px;border-radius:50%;background:var(--sf);border:2px solid var(--ln);color:var(--pri)}
.cat.on span{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.hero{margin-top:14px;border-radius:18px;background:linear-gradient(135deg,#0F2E73,#1B4DB1 60%,#4A82EC);color:#fff;padding:26px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;overflow:hidden}
.hero h1{margin:0 0 8px;font:700 34px/1.05 'Cormorant Garamond',Georgia,serif}
.hero p{margin:0 0 16px;opacity:.9;max-width:34ch}
.hero svg{width:130px;height:130px;flex:none}
.b{background:var(--pri);color:var(--onpri);border:0;border-radius:10px;padding:12px 16px;font:800 15px 'Nunito Sans',sans-serif;cursor:pointer;min-height:44px}
.b.g{background:var(--gold);color:var(--ongold)}
.b.o{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}
.b.w{width:100%}
h2{margin:24px 0 10px;font:700 25px 'Cormorant Garamond',Georgia,serif;display:flex;justify-content:space-between;align-items:baseline}
.row{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.row .pc{flex:none;width:158px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.pc{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:8px;cursor:pointer;display:flex;flex-direction:column}
.ph{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;color:rgba(255,255,255,.92);position:relative}
.ph svg.i{width:56px;height:56px;stroke-width:1.4}
.off{position:absolute;top:8px;left:8px;background:var(--gold);color:var(--ongold);font:800 12px 'Nunito Sans';padding:2px 8px;border-radius:6px}
.pn{font-weight:600;margin:8px 2px 2px;min-height:40px;line-height:1.3}
.pr{font:800 17px 'Nunito Sans';margin:0 2px}
.old{color:var(--mut);text-decoration:line-through;font-weight:400;font-size:13px;margin-left:6px}
.few{color:#C2410C;font-size:12px;font-weight:700;margin:2px;min-height:16px}
.pc .b{margin-top:6px;padding:9px;min-height:40px}
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.sv{display:flex;gap:12px;align-items:center;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px}
.sv .ic{width:46px;height:46px;border-radius:50%;background:var(--tint);color:var(--pri);display:grid;place-items:center;flex:none}
.sv b{display:block}.sv small{color:var(--mut)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.ln{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0}
.tot{border-top:1px solid var(--ln);margin-top:6px;padding-top:10px;font:800 18px 'Nunito Sans'}
.note{background:var(--tint);border-radius:10px;padding:10px 12px;font-size:14px;margin:10px 0}
.m{color:var(--mut);font-size:14px}
label{display:block;margin-top:12px;font-size:14px;color:var(--mut)}
input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--ink);font:400 16px 'Nunito Sans',sans-serif;margin-top:4px}
input[type=checkbox]{width:auto;margin-right:8px}
.q button{width:36px;height:36px;border-radius:9px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);font-size:18px;cursor:pointer}
.ban{display:flex;gap:12px;align-items:center;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-top:14px}
.app-ic{width:48px;height:48px;flex:none}
.sheet{position:fixed;inset:0;background:rgba(5,12,30,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.pnl{background:var(--sf);width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.pnl h3{margin:0 0 8px;font:700 26px 'Cormorant Garamond',Georgia,serif}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);z-index:40;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{max-width:520px;margin:auto;display:flex}
nav button{flex:1;background:none;border:0;padding:8px 4px 9px;color:var(--mut);font:700 12px 'Nunito Sans',sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button.on{color:var(--pri)}
nav .bd{right:calc(50% - 26px);top:2px}
main{padding-bottom:96px}
.ar{display:flex;gap:10px;align-items:center}.b.sm{min-height:40px;padding:8px 12px}.b:disabled{opacity:.5}.lt{font:700 19px/1 'Cormorant Garamond',Georgia,serif}@media (max-width:430px){.lt{display:none}}
footer{color:var(--mut);font-size:13px;text-align:center;padding:24px 0 8px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>

const D={};[["Sanctuaire","Abobo",8],["Sanctuaire","Yopougon",10],["Sanctuaire","Cocody",7],["Sanctuaire","Plateau",5],["Sanctuaire","Marcory",6],["Abobo","Yopougon",12],["Abobo","Cocody",14],["Abobo","Plateau",12],["Abobo","Marcory",18],["Yopougon","Cocody",18],["Yopougon","Plateau",11],["Yopougon","Marcory",14],["Cocody","Plateau",9],["Cocody","Marcory",12],["Plateau","Marcory",6]].forEach(([a,b,k])=>D[[a,b].sort().join("|")]=k);

const price=(a,b,u)=>{if(!a||!b||a===b)return null;const f=FX[kk(a,b)]||0;return Math.round((f>0?f:PR.base+km(a,b)*PR.perKm)/100)*100+(u?PR.urgent:0)};

async function loadOrders(){const[o,r]=await Promise.all([rest("GET","orders","select=*,order_items(*)&order=id.desc&limit=100"),rest("GET","delivery_requests","select=*&order=id.desc&limit=100")]);
const dt=x=>new Date(x.created_at).toLocaleDateString("fr-FR");
DB.orders=[...o.map(x=>({id:x.id,tbl:"orders",ref:x.ref,kind:"Commande",name:x.customer_name,tel:x.customer_phone,items:x.order_items.map(i=>i.quantity+" × "+i.product_name).join(", ")+(x.delivery_mode==="livraison"?" · Livraison "+x.delivery_zone:" · Retrait"),total:x.total,status:x.status,date:dt(x),ts:x.created_at})),...r.map(x=>({id:x.id,tbl:"delivery_requests",ref:x.ref,kind:"Course",name:x.requester_name,tel:x.requester_phone,items:x.from_zone+" → "+x.to_zone+" · "+x.parcel,total:x.price,status:x.status,date:dt(x),ts:x.created_at}))].sort((a,b)=>a.ts<b.ts?-1:1)}
async function sendOrder(r,f){S.msg="Envoi de la commande…";render();
try{const items=Object.entries(S.cart).map(([i,q])=>({product_id:+i,quantity:q}));
const tot=await rest("POST","rpc/create_order",null,{p_ref:r,p_name:f.cn,p_phone:f.ct,p_mode:f.cm==="liv"?"livraison":"retrait",p_zone:f.cm==="liv"?f.cz:null,p_items:items});
S.sh={t:"done",ref:r,total:tot,tel:f.ct};S.cart={};S.tab="home";S.msg="";await load()}catch(e){S.msg="La commande n’a pas pu être envoyée : "+e.message}render()}
async function sendRide(r,x,y,f,pr){S.msg="Envoi de la demande…";render();
try{await rest("POST","delivery_requests",null,{ref:r,requester_name:f.rn,requester_phone:f.rtel,from_zone:x,to_zone:y,km:km(x,y),urgent:!!f.ru,parcel:f.rd,price:pr},MIN);
S.sh={t:"done",ref:r,total:pr,tel:f.rtel};S.tab="home";S.msg=""}catch(e){S.msg="La demande n’a pas pu être envoyée : "+e.message}render()}
async function pushCfg(k){if(!REMOTE){DB.cfg={pr:PR,d:D,fx:FX};save();return}
await rest("POST","settings","on_conflict=key",[["delivery_base_fee",PR.base],["delivery_price_per_km",PR.perKm],["delivery_urgent_fee",PR.urgent],["wave_number",PR.wave]].map(([key,v])=>({key,value:String(v)})),UPS);
if(k){const[a,b]=k.split("|");await rest("POST","delivery_distances","on_conflict=zone_a,zone_b",[{zone_a:a,zone_b:b,km:D[k]||0,fixed_price:FX[k]||0}],UPS)}}
async function cchg(t){const c=t.dataset.c;
try{if(c==="ost"){const o=DB.orders[+t.dataset.i];o.status=t.value;if(REMOTE)await rest("PATCH",o.tbl,"id=eq."+o.id,{status:t.value},MIN);else save()}
else if(c==="pr"){PR[t.dataset.k]=t.dataset.k==="wave"?t.value:+t.value||0;await pushCfg()}
else if(c==="dkm"){D[t.dataset.p]=+t.value||0;await pushCfg(t.dataset.p)}
else if(c==="dfx"){FX[t.dataset.p]=+t.value||0;await pushCfg(t.dataset.p)}}catch(e){S.msg="Erreur : "+e.message}render()}
async function act(a,d){const f=S.f,R=REMOTE;
if(a==="alogin"){
if(R){try{const r=await fetch(CFG.SUPABASE_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:CFG.SUPABASE_ANON_KEY,"Content-Type":"application/json"},body:JSON.stringify({email:f.em,password:f.pw})});const j=await r.json();if(!r.ok)throw 0;TOKEN=j.access_token;
const ad=await rest("GET","admins","select=user_id");if(!ad.length){TOKEN=null;S.msg="Ce compte n’a pas les droits d’administrateur.";return}
S.adm=true;S.msg="";delete f.pw;await load();await loadOrders()}catch(e){TOKEN=null;S.msg="Connexion impossible : vérifiez l’e-mail et le mot de passe."}}
else if(f.pin==="1234"){S.adm=true;S.msg=""}else S.msg="Code incorrect.";return}
if(a==="alogout"){S.adm=false;TOKEN=null;if(R){DB.orders=[];await load()}return}
if(a==="asub"){S.as=d.v;S.msg="";clr();if(R&&d.v==="ords")await loadOrders();return}
if(a==="pedit"){const p=P.find(x=>x.id==d.id);clr();Object.assign(f,{a_id:p.id,a_n:p.n,a_cat:p.cat,a_p:p.p,a_o:p.o||"",a_s:p.s,a_d:p.d||"",a_img:p.img||"",a_on:p.on!==false});S.msg="";window.scrollTo(0,0);return}
if(a==="pcancel"){clr();S.msg="";return}
if(a==="cedit"){const c=DB.cats.find(x=>x.id===d.id);clr();Object.assign(f,{a_cid:c.id,a_cn:c.l,a_ci:c.i});S.msg="";window.scrollTo(0,0);return}
if(a==="sedit"){const v=DB.svcs.find(x=>x.id==d.id);clr();Object.assign(f,{a_sid:v.id,a_st:v.t,a_sd:v.d,a_si:v.i});S.msg="";window.scrollTo(0,0);return}
if(a==="pimgdel"){f.a_img="";return}
if(a==="pwmode"){S.rec="forgot";S.msg="";return}
if(a==="pwback"){S.rec=null;S.msg="";return}
if(a==="pwforgot"){const em=(f.em||"").trim();if(!em){S.msg="Indiquez votre e-mail.";return}
const ru=encodeURIComponent(CFG.SHARE_URL||location.origin+location.pathname);
const r=await fetch(CFG.SUPABASE_URL+"/auth/v1/recover?redirect_to="+ru,{method:"POST",headers:{apikey:CFG.SUPABASE_ANON_KEY,"Content-Type":"application/json"},body:JSON.stringify({email:em})});
S.msg=r.ok?"Si ce compte existe, un e-mail avec un lien vient d’être envoyé. Vérifiez aussi les courriers indésirables.":"L’e-mail n’a pas pu être envoyé. Réessayez dans quelques minutes.";return}
if(a==="pwset"){const p1=f.pw1||"";if(p1.length<8){S.msg="Le mot de passe doit avoir au moins 8 caractères.";return}if(p1!==f.pw2){S.msg="Les deux mots de passe ne sont pas identiques.";return}
const tk=S.rec==="reset"?RECTOK:TOKEN;
const r=await fetch(CFG.SUPABASE_URL+"/auth/v1/user",{method:"PUT",headers:{apikey:CFG.SUPABASE_ANON_KEY,Authorization:"Bearer "+tk,"Content-Type":"application/json"},body:JSON.stringify({password:p1})});
if(!r.ok){S.msg="Le mot de passe n’a pas pu être changé. Le lien a peut-être expiré : demandez-en un nouveau.";return}
delete f.pw1;delete f.pw2;if(S.rec==="reset"){S.rec=null;RECTOK=null;S.msg="Mot de passe changé. Vous pouvez vous connecter."}else S.msg="Mot de passe changé.";return}
if(a==="pask"){S.cd=+d.id;return}
if(a==="pdel"){if(R){await rest("DELETE","products","id=eq."+d.id,undefined,MIN);await load()}else{const i=P.findIndex(x=>x.id==d.id);if(i>=0)P.splice(i,1);save()}delete S.cart[d.id];S.cd=null;return}
if(a==="psave"){const n=(f.a_n||"").trim(),pr=+f.a_p;if(!n||!(pr>0)){S.msg="Indiquez le nom et un prix valide.";return}
let img=f.a_img||"";
if(R){if(img.startsWith("data:")){const bl=await(await fetch(img)).blob(),nm=Date.now()+".jpg";await api("POST","/storage/v1/object/product-images/"+nm,bl,{"Content-Type":"image/jpeg"});img=CFG.SUPABASE_URL+"/storage/v1/object/public/product-images/"+nm}
const row={category_id:f.a_cat||(DB.cats[0]||{}).id,name:n,description:f.a_d||"",price:pr,old_price:+f.a_o||0,stock:+f.a_s||0,image_url:img||null,active:f.a_on!==false};
if(f.a_id)await rest("PATCH","products","id=eq."+f.a_id,row,MIN);else await rest("POST","products",null,row,MIN);await load()}
else{const id=f.a_id||Date.now(),o={id,n,cat:f.a_cat||(DB.cats[0]||{}).id,p:pr,o:+f.a_o||0,s:+f.a_s||0,d:f.a_d||"",img,on:f.a_on!==false},i=P.findIndex(x=>x.id==id);if(i>=0)P.splice(i,1,o);else P.push(o);save()}
clr();S.msg=saveErr?"Enregistré, mais la photo est trop lourde pour la mémoire de ce navigateur.":"Article enregistré.";return}
if(a==="cadd"){const n=(f.a_cn||"").trim();if(!n){S.msg="Indiquez un nom.";return}
const eid=f.a_cid;if(R){if(eid)await rest("PATCH","categories","id=eq."+eid,{label:n,icon:f.a_ci||"chap"},MIN);else await rest("POST","categories",null,{id:"c"+Date.now(),label:n,icon:f.a_ci||"chap",position:DB.cats.length+1},MIN);await load()}else{if(eid){const c=DB.cats.find(x=>x.id===eid);c.l=n;c.i=f.a_ci||"chap"}else DB.cats.push({id:"c"+Date.now(),l:n,i:f.a_ci||"chap"});save()}clr();S.msg="";return}
if(a==="cdel"){if(P.some(p=>p.cat===d.id)){S.msg="Déplacez ou supprimez d’abord les articles de cette catégorie.";return}
if(R){await rest("DELETE","categories","id=eq."+d.id,undefined,MIN);await load()}else{DB.cats=DB.cats.filter(c=>c.id!==d.id);save()}S.msg="";return}
if(a==="sadd"){const n=(f.a_st||"").trim();if(!n)return;
const eid=f.a_sid;if(R){if(eid)await rest("PATCH","services","id=eq."+eid,{title:n,description:f.a_sd||"",icon:f.a_si||"truck"},MIN);else await rest("POST","services",null,{title:n,description:f.a_sd||"",icon:f.a_si||"truck",position:DB.svcs.length+1},MIN);await load()}else{if(eid){const v=DB.svcs.find(x=>x.id==eid);v.t=n;v.d=f.a_sd||"";v.i=f.a_si||"truck"}else DB.svcs.push({id:Date.now(),t:n,d:f.a_sd||"",i:f.a_si||"truck"});save()}clr();return}
if(a==="sdel"){if(R){await rest("DELETE","services","id=eq."+d.id,undefined,MIN);await load()}else{DB.svcs=DB.svcs.filter(s=>s.id!=d.id);save()}}}
const ADM=["alogin","alogout","asub","pedit","pcancel","pask","pdel","psave","cadd","cdel","sadd","sdel","cedit","sedit","pimgdel","pwmode","pwback","pwforgot","pwset"];
let RECTOK=null;
document.addEventListener("click",async e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;if(a==="share"){share();return}if(!ADM.includes(a))return;
try{await act(a,b.dataset)}catch(x){S.msg="Erreur : "+x.message}render()});
if(REMOTE){P.length=0;DB.cats=[];DB.svcs=[];DB.orders=[];S.ld=true}
else if(DB.cfg){Object.assign(PR,DB.cfg.pr);Object.assign(D,DB.cfg.d);Object.assign(FX,DB.cfg.fx)}
if(matchMedia("(display-mode: standalone)").matches)S.inst=false;
if(REMOTE){const hh=location.hash||"";if(/type=recovery/.test(hh)){RECTOK=new URLSearchParams(hh.slice(1)).get("access_token");if(RECTOK){S.tab="admin";S.rec="reset"}if(window.history)history.replaceState(null,"",location.pathname+location.search)}
else if(/error_code=/.test(hh)){S.tab="admin";S.rec="forgot";S.msg="Le lien a expiré. Demandez-en un nouveau.";if(window.history)history.replaceState(null,"",location.pathname+location.search)}}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();window.DEF=e});
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
render();load().then(render);
</script>
</body>
</html>
